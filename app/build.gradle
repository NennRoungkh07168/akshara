plugins {
    id 'com.android.application'
}

android {
    namespace 'org.akshara.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.akshara.app"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "4.4"
    }

    // One fixed key for every build, so new APKs install as updates
    // instead of failing with "package conflicts with an existing package".
    signingConfigs {
        akshara {
            storeFile file('akshara-debug.jks')
            storePassword 'akshara-debug'
            keyAlias 'akshara'
            keyPassword 'akshara-debug'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.akshara
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.akshara
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
